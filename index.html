<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amara's Website</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ffeaa7 0%, #fab1a0 50%, #a29bfe 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        
        .bubble {
            animation: bounce 2s ease-in-out infinite;
            display: inline-block;
        }
        
        .bubble-1 { animation-delay: 0s; }
        .bubble-2 { animation-delay: 0.15s; }
        .bubble-3 { animation-delay: 0.3s; }
        .bubble-4 { animation-delay: 0.45s; }
        .bubble-5 { animation-delay: 0.6s; }
        
        @keyframes elephant-drift {
            0%   { transform: translateX(900px); }
            100% { transform: translateX(-220px); }
        }
        @keyframes elephant-bob {
            0%, 100% { transform: translateY(0px); }
            50%       { transform: translateY(-8px); }
        }
        .elephant-stage {
            width: 100%;
            height: 200px;
            overflow: hidden;
            position: relative;
            margin-bottom: 20px;
        }
        .elephant-floater {
            position: absolute;
            top: 10px;
            left: 0;
            animation: elephant-drift 20s linear infinite;
            pointer-events: none;
        }
        .elephant-bobber {
            animation: elephant-bob 3s ease-in-out infinite;
            display: inline-block;
        }
        @keyframes water-spray-pulse {
            0%, 100% { opacity: 0.9; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.1); }
        }
        .water-spray {
            animation: water-spray-pulse 0.6s ease-in-out infinite;
            transform-origin: 15px 178px;
        }

        .parade-stage {
            width: 100%;
            overflow: hidden;
            position: relative;
            margin: 30px 0;
            height: 200px;
        }

        @keyframes parade-scroll {
            0%   { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .parade-track {
            display: flex;
            gap: 30px;
            align-items: flex-end;
            width: max-content;
            animation: parade-scroll 45s linear infinite;
            padding-left: 30px;
        }

        .parade-track svg {
            display: block;
            flex-shrink: 0;
        }
        
        .bubble-letter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            font-size: 56px;
            font-weight: 700;
            margin: 0 5px;
            border: 3px solid;
            position: relative;
            font-family: 'Fredoka', sans-serif;
            background: white;
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.6);
        }
        
        .bubble-1 {
            background-color: #FF6B9D;
            border-color: #FF4081;
        }
        
        .bubble-1 .text {
            background: linear-gradient(135deg, #FF0080, #FF1493, #E91E63);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(2px 2px 0px white) drop-shadow(-2px -2px 0px white) drop-shadow(2px -2px 0px white) drop-shadow(-2px 2px 0px white) drop-shadow(0 0 4px rgba(255, 0, 128, 0.8));
        }
        
        .bubble-2 {
            background-color: #FFB347;
            border-color: #FF9500;
        }
        
        .bubble-2 .text {
            background: linear-gradient(135deg, #FF4500, #FF6347, #DC143C);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(2px 2px 0px white) drop-shadow(-2px -2px 0px white) drop-shadow(2px -2px 0px white) drop-shadow(-2px 2px 0px white) drop-shadow(0 0 4px rgba(255, 69, 0, 0.8));
        }
        
        .bubble-3 {
            background-color: #4ECDC4;
            border-color: #2BA99D;
        }
        
        .bubble-3 .text {
            background: linear-gradient(135deg, #008B8B, #00CED1, #1E90FF);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(2px 2px 0px white) drop-shadow(-2px -2px 0px white) drop-shadow(2px -2px 0px white) drop-shadow(-2px 2px 0px white) drop-shadow(0 0 4px rgba(0, 206, 209, 0.8));
        }
        
        .bubble-4 {
            background-color: #95E1D3;
            border-color: #6FD4B8;
        }
        
        .bubble-4 .text {
            background: linear-gradient(135deg, #228B22, #00CC88, #00FF7F);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(2px 2px 0px white) drop-shadow(-2px -2px 0px white) drop-shadow(2px -2px 0px white) drop-shadow(-2px 2px 0px white) drop-shadow(0 0 4px rgba(34, 139, 34, 0.8));
        }
        
        .bubble-5 {
            background-color: #FFD93D;
            border-color: #FFC107;
        }
        
        .bubble-5 .text {
            background: linear-gradient(135deg, #9932CC, #FF1493, #FF6347);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(2px 2px 0px white) drop-shadow(-2px -2px 0px white) drop-shadow(2px -2px 0px white) drop-shadow(-2px 2px 0px white) drop-shadow(0 0 4px rgba(153, 50, 204, 0.8));
        }

        .bird-stage { width: 100%; height: 80px; overflow: hidden; position: relative; margin: 10px 0; }
        @keyframes bird-fly { 0% { transform: translateX(-100px); } 100% { transform: translateX(900px); } }
        @keyframes wing-flap { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.4); } }
        .bird { position: absolute; animation: bird-fly 14s linear infinite; }
        .bird-a { animation-duration: 18s; animation-delay: -5s; top: 30px; }
        .bird-b { animation-duration: 16s; animation-delay: -9s; top: 10px; }
        .bird-c { animation-duration: 20s; animation-delay: -2s; top: 45px; }
        .bird-d { animation-duration: 17s; animation-delay: -12s; top: 25px; }
        .bird-e { animation-duration: 19s; animation-delay: -7s; top: 5px; }
        .bird-f { animation-duration: 15s; animation-delay: -14s; top: 50px; }
        .bird-g { animation-duration: 21s; animation-delay: -3s; top: 35px; }
        .bird-h { animation-duration: 16s; animation-delay: -10s; top: 15px; }
        .wing-anim { animation: wing-flap 0.4s ease-in-out infinite; transform-origin: center; }

        .pond-stage { width: 100%; height: 140px; position: relative; overflow: hidden; margin: 10px 0; }
        @keyframes fish-jump-1 { 0%, 100% { transform: translate(0, 50px); opacity: 0; } 10% { opacity: 1; } 50% { transform: translate(60px, -10px) rotate(-15deg); opacity: 1; } 90% { opacity: 1; } 100% { transform: translate(120px, 50px) rotate(20deg); opacity: 0; } }
        @keyframes fish-jump-2 { 0%, 100% { transform: translate(0, 50px); opacity: 0; } 15% { opacity: 1; } 50% { transform: translate(-50px, 0px) rotate(15deg); opacity: 1; } 85% { opacity: 1; } 100% { transform: translate(-100px, 50px) rotate(-20deg); opacity: 0; } }
        @keyframes fish-jump-3 { 0%, 100% { transform: translate(0, 50px); opacity: 0; } 20% { opacity: 1; } 50% { transform: translate(40px, 5px) rotate(-10deg); opacity: 1; } 80% { opacity: 1; } 100% { transform: translate(80px, 50px) rotate(25deg); opacity: 0; } }
        .fish-1 { position: absolute; left: 15%; top: 30px; animation: fish-jump-1 4s ease-in-out infinite; }
        .fish-2 { position: absolute; left: 45%; top: 30px; animation: fish-jump-2 5s ease-in-out infinite; animation-delay: -1.5s; }
        .fish-3 { position: absolute; left: 70%; top: 35px; animation: fish-jump-3 4.5s ease-in-out infinite; animation-delay: -3s; }
        @keyframes fish-jump-4 { 0%, 100% { transform: translate(0, 50px); opacity: 0; } 12% { opacity: 1; } 50% { transform: translate(-40px, -5px) rotate(12deg); opacity: 1; } 88% { opacity: 1; } 100% { transform: translate(-90px, 50px) rotate(-18deg); opacity: 0; } }
        @keyframes fish-jump-5 { 0%, 100% { transform: translate(0, 50px); opacity: 0; } 18% { opacity: 1; } 50% { transform: translate(50px, 0px) rotate(-12deg); opacity: 1; } 82% { opacity: 1; } 100% { transform: translate(100px, 50px) rotate(22deg); opacity: 0; } }
        @keyframes fish-jump-6 { 0%, 100% { transform: translate(0, 50px); opacity: 0; } 14% { opacity: 1; } 50% { transform: translate(-30px, 5px) rotate(18deg); opacity: 1; } 86% { opacity: 1; } 100% { transform: translate(-70px, 50px) rotate(-15deg); opacity: 0; } }
        .fish-4 { position: absolute; left: 28%; top: 32px; animation: fish-jump-4 5.5s ease-in-out infinite; animation-delay: -2s; }
        .fish-5 { position: absolute; left: 58%; top: 28px; animation: fish-jump-5 4.2s ease-in-out infinite; animation-delay: -0.8s; }
        .fish-6 { position: absolute; left: 85%; top: 33px; animation: fish-jump-6 4.8s ease-in-out infinite; animation-delay: -2.5s; }
        @keyframes ripple { 0% { transform: scale(0.3); opacity: 0.8; } 100% { transform: scale(1.5); opacity: 0; } }
        .ripple-anim-1 { animation: ripple 4s ease-out infinite; transform-origin: center; }
        .ripple-anim-2 { animation: ripple 5s ease-out infinite; animation-delay: -1.5s; transform-origin: center; }
        .ripple-anim-3 { animation: ripple 4.5s ease-out infinite; animation-delay: -3s; transform-origin: center; }

        .fun-section { max-width: 800px; margin: 30px auto; padding: 20px; }
        .section-title { font-family: 'Fredoka', sans-serif; font-size: 32px; font-weight: 600; text-align: center; margin: 20px 0; color: #6B46C1; }
        .button-row { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; margin: 20px 0; }
        .fun-button { font-family: 'Fredoka', sans-serif; font-size: 20px; font-weight: 600; padding: 18px 28px; border-radius: 30px; border: 4px solid; cursor: pointer; transition: all 0.2s; color: white; box-shadow: 0 4px 0 rgba(0,0,0,0.15); }
        .fun-button:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.15); }
        .btn-pink { background: #FF6B9D; border-color: #E91E63; }
        .btn-orange { background: #FFB347; border-color: #FF9500; }
        .btn-teal { background: #4ECDC4; border-color: #2BA99D; }
        .btn-purple { background: #B57EDC; border-color: #8B5CB8; }
        .btn-yellow { background: #FFD93D; border-color: #FFC107; color: #333; }

        .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0; }
        .game-card { background: white; border: 4px solid #B57EDC; border-radius: 20px; padding: 20px; }
        .game-title { font-family: 'Fredoka', sans-serif; font-size: 24px; font-weight: 600; color: #6B46C1; text-align: center; margin-bottom: 15px; }
        .shape-game-area { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; min-height: 80px; align-items: center; }
        .clickable-shape { cursor: pointer; transition: transform 0.2s; }
        .clickable-shape:hover { transform: scale(1.15); }
        .clickable-shape:active { transform: scale(0.9); }
        .game-message { text-align: center; font-family: 'Fredoka', sans-serif; font-size: 18px; min-height: 24px; margin-top: 10px; color: #6B46C1; }
        .color-swatch { width: 60px; height: 60px; border-radius: 50%; border: 3px solid #333; cursor: pointer; transition: transform 0.2s; }
        .color-swatch:hover { transform: scale(1.1); }
        .color-target { width: 80px; height: 80px; border-radius: 50%; border: 4px solid #333; margin: 0 auto 10px; }

        .confetti { position: fixed; width: 12px; height: 12px; pointer-events: none; z-index: 1000; }
        @keyframes confetti-fall { 0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }

        @media (max-width: 600px) {
            .game-grid { grid-template-columns: 1fr; }
            .fun-button { font-size: 16px; padding: 14px 20px; }
        }

        .music-controls { text-align: center; margin: 20px 0; }
        .music-button { font-family: 'Fredoka', sans-serif; font-size: 18px; padding: 12px 24px; border-radius: 25px; border: 3px solid #6B46C1; background: white; color: #6B46C1; cursor: pointer; font-weight: 600; }
        .music-button:hover { background: #6B46C1; color: white; }
    </style>
</head>

            <svg class="clickable-shape" width="50" height="50" viewBox="0 0 50 50" onclick="popBubble(this)">
              <circle cx="25" cy="25" r="22" fill="#FFB347" stroke="#FF9500" stroke-width="3"/>
              <circle cx="18" cy="18" r="5" fill="#fff" opacity="0.7"/>
            </svg>
          </div>
          <div class="game-message" id="bubble-message">Pop them all!</div>
          <div style="text-align:center; margin-top: 10px;"><button class="music-button" onclick="resetBubbles()">Reset</button></div>
        </div>

        <div class="game-card">
          <div class="game-title">Match the color!</div>
          <div class="color-target" id="color-target" style="background: #FF6B9D;"></div>
          <div class="shape-game-area" id="color-game">
            <div class="color-swatch" style="background: #FF6B9D;" onclick="checkColor(this, '#FF6B9D')"></div>
            <div class="color-swatch" style="background: #4ECDC4;" onclick="checkColor(this, '#4ECDC4')"></div>
            <div class="color-swatch" style="background: #FFD93D;" onclick="checkColor(this, '#FFD93D')"></div>
            <div class="color-swatch" style="background: #B57EDC;" onclick="checkColor(this, '#B57EDC')"></div>
          </div>
          <div class="game-message" id="color-message">Click the matching color!</div>
        </div>

        <div class="game-card">
          <div class="game-title">Count the stars!</div>
          <div class="shape-game-area" id="count-game">
            <svg width="40" height="40" viewBox="0 0 40 40" class="clickable-shape" onclick="countStar(this)">
              <polygon points="20,4 25,16 38,16 28,24 32,36 20,28 8,36 12,24 2,16 15,16" fill="#FFD93D" stroke="#FFC107" stroke-width="2"/>
            </svg>
            <svg width="40" height="40" viewBox="0 0 40 40" class="clickable-shape" onclick="countStar(this)">
              <polygon points="20,4 25,16 38,16 28,24 32,36 20,28 8,36 12,24 2,16 15,16" fill="#FFD93D" stroke="#FFC107" stroke-width="2"/>
            </svg>
            <svg width="40" height="40" viewBox="0 0 40 40" class="clickable-shape" onclick="countStar(this)">
              <polygon points="20,4 25,16 38,16 28,24 32,36 20,28 8,36 12,24 2,16 15,16" fill="#FFD93D" stroke="#FFC107" stroke-width="2"/>
            </svg>
            <svg width="40" height="40" viewBox="0 0 40 40" class="clickable-shape" onclick="countStar(this)">
              <polygon points="20,4 25,16 38,16 28,24 32,36 20,28 8,36 12,24 2,16 15,16" fill="#FFD93D" stroke="#FFC107" stroke-width="2"/>
            </svg>
          </div>
          <div class="game-message" id="count-message">Click each star! Count: 0</div>
          <div style="text-align:center; margin-top: 10px;"><button class="music-button" onclick="resetStars()">Reset</button></div>
        </div>

        <div class="game-card">
          <div class="game-title">Find the shape!</div>
          <div class="game-message" id="shape-prompt" style="font-size: 22px; margin-bottom: 12px;">Find the circle!</div>
          <div class="shape-game-area" id="shape-game">
            <svg class="clickable-shape" width="50" height="50" viewBox="0 0 50 50" onclick="checkShape(this, 'circle')">
              <circle cx="25" cy="25" r="22" fill="#FF6B9D" stroke="#333" stroke-width="2"/>
            </svg>
            <svg class="clickable-shape" width="50" height="50" viewBox="0 0 50 50" onclick="checkShape(this, 'square')">
              <rect x="5" y="5" width="40" height="40" fill="#4ECDC4" stroke="#333" stroke-width="2"/>
            </svg>
            <svg class="clickable-shape" width="50" height="50" viewBox="0 0 50 50" onclick="checkShape(this, 'triangle')">
              <polygon points="25,5 45,42 5,42" fill="#FFD93D" stroke="#333" stroke-width="2"/>
            </svg>
            <svg class="clickable-shape" width="50" height="50" viewBox="0 0 50 50" onclick="checkShape(this, 'star')">
              <polygon points="25,5 31,20 47,20 34,30 39,46 25,36 11,46 16,30 3,20 19,20" fill="#B57EDC" stroke="#333" stroke-width="2"/>
            </svg>
          </div>
        </div>

      </div>

      <div class="section-title">Music!</div>
      <div class="music-controls">
        <button class="music-button" onclick="toggleMusic()" id="music-btn">Play "Mary Had a Little Lamb"</button>
      </div>
    </div>


    <script>
      function popConfetti() {
        const colors = ['#FF6B9D','#4ECDC4','#FFD93D','#B57EDC','#FFB347','#3DB37E'];
        for (let i = 0; i < 50; i++) {
          const c = document.createElement('div');
          c.className = 'confetti';
          c.style.left = Math.random() * 100 + 'vw';
          c.style.top = '-20px';
          c.style.background = colors[Math.floor(Math.random()*colors.length)];
          c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
          c.style.animation = 'confetti-fall ' + (2 + Math.random() * 2) + 's linear forwards';
          c.style.animationDelay = Math.random() * 0.5 + 's';
          document.body.appendChild(c);
          setTimeout(() => c.remove(), 5000);
        }
      }

      function bounceAnimals() {
        const track = document.querySelector('.parade-track');
        if (!track) return;
        track.style.animation = 'none';
        track.offsetHeight;
        track.style.animation = '';
        const svgs = track.querySelectorAll('svg');
        svgs.forEach((svg, i) => {
          svg.style.transition = 'transform 0.4s';
          setTimeout(() => {
            svg.style.transform = 'translateY(-30px)';
            setTimeout(() => { svg.style.transform = 'translateY(0)'; }, 400);
          }, i * 60);
        });
      }

      let rainbowOn = false;
      function rainbowBackground() {
        const body = document.body;
        if (rainbowOn) return;
        rainbowOn = true;
        const orig = body.style.background;
        const colors = ['#FF6B9D','#FFB347','#FFD93D','#4ECDC4','#B57EDC','#FF6B9D'];
        let i = 0;
        const interval = setInterval(() => {
          body.style.background = colors[i % colors.length];
          body.style.transition = 'background 0.4s';
          i++;
        }, 400);
        setTimeout(() => {
          clearInterval(interval);
          body.style.background = '';
          rainbowOn = false;
        }, 4000);
      }

      let audioCtx = null;
      function getAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        return audioCtx;
      }
      function playTone(freq, duration, type, volume) {
        const ctx = getAudio();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type || 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(volume || 0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      }

      function playBoop() {
        playTone(440, 0.15, 'sine', 0.4);
        setTimeout(() => playTone(660, 0.15, 'sine', 0.4), 100);
      }

      function spinName() {
        const letters = document.querySelectorAll('.bubble-letter .text');
        letters.forEach((t, i) => {
          t.style.transition = 'transform 0.6s';
          t.style.display = 'inline-block';
          setTimeout(() => {
            t.style.transform = 'rotate(360deg)';
            setTimeout(() => {
              t.style.transition = 'none';
              t.style.transform = '';
            }, 650);
          }, i * 100);
        });
      }

      function popBubble(el) {
        playTone(800 + Math.random() * 400, 0.1, 'sine', 0.3);
        el.style.transition = 'transform 0.2s, opacity 0.2s';
        el.style.transform = 'scale(1.5)';
        el.style.opacity = '0';
        setTimeout(() => { el.style.visibility = 'hidden'; }, 200);
        const remaining = Array.from(document.querySelectorAll('#bubble-game svg')).filter(s => s.style.opacity !== '0').length;
        const msg = document.getElementById('bubble-message');
        if (remaining === 0) {
          msg.textContent = 'You popped them all! Yay!';
          popConfetti();
        } else {
          msg.textContent = remaining + ' left to pop!';
        }
      }
      function resetBubbles() {
        document.querySelectorAll('#bubble-game svg').forEach(s => {
          s.style.visibility = '';
          s.style.opacity = '1';
          s.style.transform = '';
        });
        document.getElementById('bubble-message').textContent = 'Pop them all!';
      }

      const colorPalette = ['#FF6B9D','#4ECDC4','#FFD93D','#B57EDC'];
      function checkColor(el, color) {
        const target = document.getElementById('color-target').style.background;
        const targetHex = rgbToHex(target);
        const msg = document.getElementById('color-message');
        if (color.toUpperCase() === targetHex.toUpperCase()) {
          msg.textContent = 'You got it!';
          playTone(660, 0.1, 'sine', 0.3);
          setTimeout(() => playTone(880, 0.15, 'sine', 0.3), 100);
          setTimeout(() => {
            const next = colorPalette[Math.floor(Math.random() * colorPalette.length)];
            document.getElementById('color-target').style.background = next;
            msg.textContent = 'Click the matching color!';
          }, 1000);
        } else {
          msg.textContent = 'Try again!';
          playTone(220, 0.2, 'sine', 0.3);
        }
      }
      function rgbToHex(rgb) {
        if (rgb.startsWith('#')) return rgb;
        const m = rgb.match(/\d+/g);
        if (!m) return rgb;
        return '#' + m.slice(0, 3).map(n => parseInt(n).toString(16).padStart(2, '0')).join('');
      }

      let starCount = 0;
      function countStar(el) {
        if (el.dataset.clicked) return;
        el.dataset.clicked = '1';
        el.style.opacity = '0.4';
        starCount++;
        playTone(400 + starCount * 100, 0.15, 'sine', 0.3);
        const total = document.querySelectorAll('#count-game svg').length;
        const msg = document.getElementById('count-message');
        if (starCount === total) {
          msg.textContent = 'You counted all ' + total + ' stars!';
          popConfetti();
        } else {
          msg.textContent = 'Click each star! Count: ' + starCount;
        }
      }
      function resetStars() {
        starCount = 0;
        document.querySelectorAll('#count-game svg').forEach(s => {
          s.dataset.clicked = '';
          s.style.opacity = '1';
        });
        document.getElementById('count-message').textContent = 'Click each star! Count: 0';
      }

      const shapes = ['circle','square','triangle','star'];
      let currentShape = 'circle';
      function checkShape(el, shape) {
        const msg = document.getElementById('shape-prompt');
        if (shape === currentShape) {
          msg.textContent = 'You found it!';
          playTone(660, 0.1, 'sine', 0.3);
          setTimeout(() => playTone(880, 0.15, 'sine', 0.3), 100);
          setTimeout(() => {
            currentShape = shapes[Math.floor(Math.random() * shapes.length)];
            msg.textContent = 'Find the ' + currentShape + '!';
          }, 1000);
        } else {
          msg.textContent = 'Not that one! Find the ' + currentShape + '!';
          playTone(220, 0.2, 'sine', 0.3);
        }
      }

      function playChord(freqs, duration, type, volume) {
        const ctx = getAudio();
        freqs.forEach(freq => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = type || 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(volume || 0.15, ctx.currentTime + 0.05);
          gain.gain.setValueAtTime(volume || 0.15, ctx.currentTime + duration - 0.1);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + duration);
        });
      }

      const C_MAJOR  = [261.63, 329.63, 392.00];
      const F_MAJOR  = [349.23, 440.00, 523.25];
      const G_MAJOR  = [392.00, 493.88, 587.33];
      const C_BASS   = 130.81;
      const F_BASS   = 174.61;
      const G_BASS   = 196.00;

      const symphony = [
        { mel: 659.25, dur: 0.5, chord: C_MAJOR, bass: C_BASS },
        { mel: 587.33, dur: 0.5, chord: C_MAJOR, bass: C_BASS },
        { mel: 523.25, dur: 0.5, chord: C_MAJOR, bass: C_BASS },
        { mel: 587.33, dur: 0.5, chord: C_MAJOR, bass: C_BASS },
        { mel: 659.25, dur: 0.5, chord: C_MAJOR, bass: C_BASS },
        { mel: 659.25, dur: 0.5, chord: C_MAJOR, bass: C_BASS },
        { mel: 659.25, dur: 1.0, chord: C_MAJOR, bass: C_BASS },
        { mel: 587.33, dur: 0.5, chord: G_MAJOR, bass: G_BASS },
        { mel: 587.33, dur: 0.5, chord: G_MAJOR, bass: G_BASS },
        { mel: 587.33, dur: 1.0, chord: G_MAJOR, bass: G_BASS },
        { mel: 659.25, dur: 0.5, chord: C_MAJOR, bass: C_BASS },
        { mel: 783.99, dur: 0.5, chord: G_MAJOR, bass: G_BASS },
        { mel: 783.99, dur: 1.0, chord: G_MAJOR, bass: G_BASS },
        { mel: 659.25, dur: 0.5, chord: C_MAJOR, bass: C_BASS },
        { mel: 587.33, dur: 0.5, chord: F_MAJOR, bass: F_BASS },
        { mel: 523.25, dur: 0.5, chord: C_MAJOR, bass: C_BASS },
        { mel: 587.33, dur: 0.5, chord: G_MAJOR, bass: G_BASS },
        { mel: 659.25, dur: 0.5, chord: C_MAJOR, bass: C_BASS },
        { mel: 659.25, dur: 0.5, chord: C_MAJOR, bass: C_BASS },
        { mel: 659.25, dur: 0.5, chord: C_MAJOR, bass: C_BASS },
        { mel: 659.25, dur: 0.5, chord: C_MAJOR, bass: C_BASS },
        { mel: 587.33, dur: 0.5, chord: G_MAJOR, bass: G_BASS },
        { mel: 587.33, dur: 0.5, chord: G_MAJOR, bass: G_BASS },
        { mel: 659.25, dur: 0.5, chord: C_MAJOR, bass: C_BASS },
        { mel: 587.33, dur: 0.5, chord: G_MAJOR, bass: G_BASS },
        { mel: 523.25, dur: 1.5, chord: C_MAJOR, bass: C_BASS }
      ];

      let musicPlaying = false;
      let musicTimeouts = [];
      function toggleMusic() {
        const btn = document.getElementById('music-btn');
        if (musicPlaying) {
          musicPlaying = false;
          musicTimeouts.forEach(t => clearTimeout(t));
          musicTimeouts = [];
          btn.textContent = 'Play "Mary Had a Little Lamb"';
        } else {
          musicPlaying = true;
          btn.textContent = 'Stop music';
          playMelody();
        }
      }
      function playMelody() {
        if (!musicPlaying) return;
        let t = 0;
        symphony.forEach(note => {
          const timeout = setTimeout(() => {
            if (!musicPlaying) return;
            playTone(note.mel, note.dur * 0.9, 'triangle', 0.28);
            playChord(note.chord, note.dur * 0.95, 'sine', 0.08);
            playTone(note.bass, note.dur * 0.95, 'sine', 0.18);
          }, t * 1000);
          musicTimeouts.push(timeout);
          t += note.dur;
        });
        const loopTimeout = setTimeout(() => {
          if (musicPlaying) playMelody();
        }, t * 1000 + 500);
        musicTimeouts.push(loopTimeout);
      }
    </script>

</body>
